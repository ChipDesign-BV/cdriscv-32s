        run: make coverage
      # Not a gate.  Objective O6 is met with reviewed waivers and O7 is
      # at 100 %, but failing a build on a coverage percentage tempts
      # people to waive rather than test.  The report is published and
      # read instead.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/coverage.txt

  nightly-deep:
    name: gate level, timing and fault injection
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
