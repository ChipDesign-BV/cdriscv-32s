            [ -r "$f" ] && . "$f" >/dev/null 2>&1 || true
          done
          set -u
          for d in /foss/tools/bin /foss/tools/sak /foss/tools/klayout \
                   /foss/tools/kactus2 /foss/tools/osic-multitool; do
            [ -d "$d" ] && PATH="$d:$PATH"
          done
          for t in verilator iverilog yosys vvp sby verilator_coverage; do
            command -v "$t" >/dev/null 2>&1 && continue
            d=$(find / -xdev -name "$t" -type f -perm -u+x 2>/dev/null | head -1)
            [ -n "$d" ] && PATH="$(dirname "$d"):$PATH"
          done
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "PYTHONPATH=${PYTHONPATH:-}" >> "$GITHUB_ENV"
          # vvp finds its libvvp.so.1 through this, not through PATH
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "--- resolved ---"
          for t in verilator iverilog yosys vvp sby verilator_coverage; do
            printf '%-20s %s\n' "$t" "$(command -v "$t" 2>/dev/null || echo MISSING)"
          done
          command -v verilator >/dev/null   # hard gate: the rest is pointless without it

      - name: Cache the Spike build
        id: spike-cache
        uses: actions/cache@v4
        with:
          path: /opt/spike
          key: spike-${{ runner.os }}-v1

      - name: Build Spike
        if: steps.spike-cache.outputs.cache-hit != 'true'
        run: sh scripts/build_spike.sh /opt/spike

      - name: Directed ISA program
        run: make cosim SPIKE=/opt/spike/bin/spike

      - name: Random programs (short, on every push)
        if: github.event_name != 'schedule'
        run: make cosim-random SPIKE=/opt/spike/bin/spike RANDOM_SEEDS=50

      - name: Random programs (long, nightly)
        if: github.event_name == 'schedule'
        run: make cosim-random SPIKE=/opt/spike/bin/spike RANDOM_SEEDS=2000 RANDOM_LEN=800

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failing-random-programs
          path: build/random/

  software-tests:
    name: subsystem software tests
    runs-on: ubuntu-latest
    container:
      image: hpretl/iic-osic-tools:2026.07
