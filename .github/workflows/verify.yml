            d=$(find / -xdev -name "$t" -type f -perm -u+x 2>/dev/null | head -1)
            [ -n "$d" ] && PATH="$(dirname "$d"):$PATH"
          done
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "PYTHONPATH=${PYTHONPATH:-}" >> "$GITHUB_ENV"
          # vvp finds its libvvp.so.1 through this, not through PATH
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "--- resolved ---"
          for t in verilator iverilog yosys vvp sby verilator_coverage; do
            printf '%-20s %s\n' "$t" "$(command -v "$t" 2>/dev/null || echo MISSING)"
          done
          command -v verilator >/dev/null   # hard gate: the rest is pointless without it

      # Each of these found something when it was written -- the safety
      # tests three clock-domain defects, the fence test two decoder
      # lines that had been wrongly waived, the read-back test a slot
      # that raises a bus error where every other slot reads zero.
      - name: Safety bench and safety software
        run: make safety
      - name: Peripherals
        run: make periph
      - name: Safety reactions
        run: make reaction
      - name: Traps
        run: make trap
      - name: AMS interface
        run: make ams
      - name: Register walk
        run: make regwalk
      - name: FENCE, FENCE.I and the writable CSRs
        run: make fence
      - name: Peripheral read-back
        run: make rdback

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-software-tests
          path: build/*.log

  formal:
    name: formal property benches
    runs-on: ubuntu-latest
    container:
      image: hpretl/iic-osic-tools:2026.07
