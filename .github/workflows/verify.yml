#
# cdriscv-32s continuous verification.
#
# NOTE: this workflow has never run on a real runner.  It is written
# from the commands that pass locally in the IIC-OSIC-TOOLS container,
# and the first run will need fixing.  Do not read a green badge into it
# until one has actually happened.
#
# The jobs below gate everything the Makefile can check.  The cheap
# work runs on every push; gate level simulation, static timing and the
# fault injection campaign are nightly, because they take tens of
# minutes each and a push gate that people wait on gets disabled.
#
# Cadence follows doc/verification_plan.md section 10: everything cheap
# on every push, the expensive random regression nightly.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly, off the hour to avoid the crowd
    - cron: '37 2 * * *'
  workflow_dispatch:

jobs:
  lint-and-block:
    name: lint, block benches, smoke
    runs-on: ubuntu-latest
    container:
      image: hpretl/iic-osic-tools:2026.07
      # The image runs as an unprivileged user; the runner's /__w is owned by
      # root, so actions/checkout fails with EACCES writing its state file.
      options: --user root
    defaults:
      run:
        # The container advertises no bash to Actions, so steps default to
        # 'sh -e', which is dash here.  Sourcing the image's bash-syntax
        # profile under dash is a parse-time abort (exit 2, no output).
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@v4

      - name: Tool environment
        # The image keeps its tools outside the default PATH and sets them up
        # from a login profile, which an Actions step's shell never sources.
        # Without this every step dies with "verilator: command not found".
        # Sourcing the profile is tried first; if the image has moved things,
        # fall back to locating each tool and adding its directory.
        run: |
          set -e
          set +u   # the setup script reads variables it does not always set
          for f in /etc/profile.d/iic-osic-tools-setup.sh /headless/.bashrc; do
            [ -r "$f" ] && . "$f" >/dev/null 2>&1 || true
          done
          set -u
          for d in /foss/tools/bin /foss/tools/sak /foss/tools/klayout \
                   /foss/tools/kactus2 /foss/tools/osic-multitool; do
            [ -d "$d" ] && PATH="$d:$PATH"
          done
          for t in verilator iverilog yosys vvp sby verilator_coverage; do
            command -v "$t" >/dev/null 2>&1 && continue
            d=$(find / -xdev -name "$t" -type f -perm -u+x 2>/dev/null | head -1)
            [ -n "$d" ] && PATH="$(dirname "$d"):$PATH"
          done
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "PYTHONPATH=${PYTHONPATH:-}" >> "$GITHUB_ENV"
          # vvp finds its libvvp.so.1 through this, not through PATH
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "--- resolved ---"
          for t in verilator iverilog yosys vvp sby verilator_coverage; do
            printf '%-20s %s\n' "$t" "$(command -v "$t" 2>/dev/null || echo MISSING)"
          done
          command -v verilator >/dev/null   # hard gate: the rest is pointless without it

      - name: Lint (hard gate, waivers in verif/lint/waivers.vlt)
        run: make lint

      - name: Lint the bench
        run: make lint-tb

      - name: Block benches
        run: make block

      - name: Build the smoke program
        run: make sw

      - name: Smoke simulation
        run: make sim

      - name: Generic synthesis, structural check
        run: make synth

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-lint-and-block
          path: build/*.log

  cosim:
    name: co-simulation against Spike
    runs-on: ubuntu-latest
    container:
      image: hpretl/iic-osic-tools:2026.07
      # The image runs as an unprivileged user; the runner's /__w is owned by
      # root, so actions/checkout fails with EACCES writing its state file.
      options: --user root
    defaults:
      run:
